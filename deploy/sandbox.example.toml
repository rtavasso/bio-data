# Copy to <commons>/sandbox.toml. See docs/colloquy/runtime.md (Sandbox).
engine = "docker"                    # or "podman"
image = "colloquy-agent:latest"      # deploy/agent.Dockerfile
network = "colloquy-egress"          # internal network: docker network create --internal colloquy-egress
proxy = "http://egress:3128"         # `bio commons egress` on that network; each dispatch adds its own credential
allow_hosts = []                     # extra data hosts (source adapter hosts are built in)
model_hosts = []                     # extra model hosts (each dispatch adds its own harness provider hosts)
scratch_bytes = 2147483648
memory = "8g"
cpus = "4"
pids_limit = 1024
env = ["ANTHROPIC_API_KEY"]          # names of host variables the harness may receive
ro_mounts = []
mount_host_python = false
# Spec v2 V9 (docs/colloquy/hardening.md): per-agent container uids and a checkout disk quota.
# agent_uid = "per-agent"            # each agent runs as uid_base + its recorded index (default "dispatcher")
# uid_base = 200000
# agent_gid = 1000                   # shared group of agent uids and the board service (default: dispatcher's gid)
# disk_quota_bytes = 21474836480     # 20 GiB per checkout
# disk_quota_method = "measure"      # measure (portable, soft) | storage-opt (engine) | xfs-project (hard, Linux)
# xfs_project_base = 50000
